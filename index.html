<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Перенаправление...</title>
    <script>
        // Считываем параметры из адресной строки
        const params = new URLSearchParams(window.location.search);
        const targetUrl = params.get('url');

        if (targetUrl) {
            // Мгновенный редирект (replace удаляет страницу из истории, чтобы кнопка «Назад» не возвращала сюда)
            window.location.replace(targetUrl);
        }
    </script>
</head>
<body>
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; margin-top: 50px; color: #333;">
        <p id="msg">Перенаправление...</p>
        <p><a id="link" href="#" style="color: #0066cc; word-break: break-all; display: none;">Нажмите здесь, если переход не произошел автоматически</a></p>
    </div>
    <script>
        if (targetUrl) {
            const link = document.getElementById('link');
            link.href = targetUrl;
            link.innerText = targetUrl;
            link.style.display = 'inline';
            document.getElementById('msg').innerText = 'Перенаправление на внешний ресурс:';
        } else {
            document.getElementById('msg').innerHTML = '<span style="color: red;">Ошибка: не указан параметр <code>url</code>.</span>';
        }
    </script>
</body>
</html>
